<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق لغة الإشارة</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container fade-in">
        <!-- Left Section: Live Sign Detection (Camera) -->
        <div class="glass-card camera-section" style="direction:ltr;">
            <div class="section-title"
                style="font-family:'Inter',sans-serif; display:flex; justify-content:space-between; align-items:center;">
                <span>Live Sign Detection</span>
            </div>
            <div class="video-container">
                <img id="video-feed" src="/snapshot" alt="Camera Feed">
                <div id="detected-char" class="char-overlay">الحرف: ...</div>
                <button id="btn-toggle-capture" class="capture-toggle" title="تشغيل/إيقاف الالتقاط">
                    <i class="fas fa-video"></i>
                </button>
            </div>
        </div>

        <!-- Right Section: Translation & Interaction -->
        <div class="translation-section">
            <div class="text-display-box">
                <div id="sentence-display" class="sentence-display"></div>

                <div class="suggestions-container" id="suggestions">
                    <!-- سيتم ملؤها ديناميكياً عبر JavaScript -->
                </div>
            </div>

            <div class="controls-section">
                <!-- أزرار التحكم كما في الصورة -->
                <button id="btn-speak" class="btn btn-primary">
                    تشغيل الصوت <i class="fas fa-volume-up"></i>
                </button>
                <button id="btn-clear" class="btn btn-secondary" title="حذف حرف">
                    مسح <i class="fas fa-trash-alt"></i>
                </button>
                <button id="btn-finish" class="btn btn-danger">إنهاء الجملة</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
